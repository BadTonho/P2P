[package]
name = "p2p-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
cpal = "0.18.2"
bytes = "1"
eframe = "0.36.2"
futures-util = "0.3"
openh264 = { version = "0.9.8", features = ["source"] }
rtrb = "0.4"
rtc = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signaling-protocol = { path = "../signaling-protocol" }
signaling-server = { path = "../signaling-server" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "sync", "time"] }
tokio-tungstenite = "0.30"
webrtc = "0.21"
windows-capture = "2.0.1"

[target.'cfg(target_os = "windows")'.dependencies]
ipconfig = "0.3.4"
