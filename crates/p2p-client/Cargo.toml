[package]
name = "p2p-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.22"
cpal = "0.18.2"
bytes = "1"
eframe = "0.36.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rand = "0.9"
sha2 = "0.10"
openh264 = { version = "0.9.8", features = ["source"] }
opus = "0.3.1"
rtrb = "0.4"
rfd = { version = "0.16", default-features = false }
rtc = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signaling-protocol = { path = "../signaling-protocol" }
signaling-server = { path = "../signaling-server" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "sync", "time"] }
tokio-tungstenite = "0.30"
time = { version = "0.3.55", features = ["formatting"] }
turn-server = { version = "=4.1.5", default-features = false, features = ["udp"] }
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "time"] }
webrtc = "0.21"
windows-capture = "2.0.1"

[target.'cfg(target_os = "windows")'.dependencies]
ipconfig = "0.3.4"
windows = { version = "0.62.2", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
