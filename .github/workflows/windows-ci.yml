name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Format, test, and build
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Configure Windows resource compiler
        shell: pwsh
        run: |
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $rc = Get-ChildItem $sdkBin -Directory |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\rc.exe' } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $rc) {
            throw 'Windows SDK resource compiler rc.exe was not found.'
          }
          "RC=$rc" >> $env:GITHUB_ENV

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Build workspace
        run: cargo build --workspace --locked
